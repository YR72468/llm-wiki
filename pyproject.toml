[tool.poetry]
name = "llm-wiki"
version = "0.1.0"
description = "LLM Knowledge Wiki - A knowledge graph management system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/your-org/llm-wiki"
repository = "https://github.com/your-org/llm-wiki"
keywords = ["knowledge-graph", "llm", "nlp", "networkx"]

[tool.poetry.dependencies]
python = "^3.10"
networkx = "^2.8"
jsonschema = "^4.0"
pyyaml = "^6.0"
markdown = "^3.4"
requests = "^2.28"
click = "^8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
pytest-mock = "^3.10"
flake8 = "^6.0"
pylint = "^2.17"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"
safety = "^2.0"
bandit = "^1.7"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.4"
mkdocs-material = "^9.0"
markdown-include = "^0.8"
pygments = "^2.15"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Black 配置
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

# isort 配置
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy 配置
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["networkx.*", "yaml.*"]
ignore_missing_imports = true

# Pytest 配置（已在 pytest.ini 中，此处为别名）
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=knowledge_engine"

# Pylint 配置
[tool.pylint]
max-line-length = 100
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
]
good-names = ["i", "j", "k", "ex", "_", "e"]

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "missing-docstring",
]