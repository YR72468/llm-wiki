name: LLM Wiki CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 每日凌晨 2 点巡检知识库健康

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ───────────────────────────────────────────────
  # 1. 代码风格检查
  # ───────────────────────────────────────────────
  lint:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: pip install flake8 black isort
      - name: Run Flake8
        run: flake8 knowledge_engine/ tests/ main.py
      - name: Run Black check
        run: black --check knowledge_engine/ tests/ main.py

  # ───────────────────────────────────────────────
  # 2. 多版本单元测试 + 覆盖率
  # ───────────────────────────────────────────────
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest pytest-cov networkx jsonschema pyyaml markdown requests click
      - name: Run pytest with coverage
        run: pytest tests/ -v
        env:
          KNOWLEDGE_BASE_PATH: './knowledge-base'

  # ───────────────────────────────────────────────
  # 3. 知识图谱真实校验（基于仓库内 graph.json）
  # ───────────────────────────────────────────────
  knowledge-graph-validation:
    name: Knowledge Graph Validation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install networkx jsonschema
      - name: Run audit on real graph
        run: python main.py --audit --graph knowledge-base/graph.json --report output/health-report.md
      - name: Validate report
        run: |
          test -f output/health-report.md
          grep -q "健康评分" output/health-report.md
          echo "✅ 健康报告生成成功，含健康评分章节"
      - name: Entity statistics
        run: |
          python -c "
          import json
          g = json.load(open('knowledge-base/graph.json', encoding='utf-8'))
          ents = g.get('entities', {})
          print(f'实体总数: {len(ents)}')
          meta = g.get('metadata', {})
          print(f'来源文档: {meta.get(\"sources\", [])}')
          "

  # ───────────────────────────────────────────────
  # 4. 安全扫描（不阻断主流程）
  # ───────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run safety check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
          echo "safety scan done"
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r knowledge_engine/ -f json -o bandit-report.json || true
          echo "bandit scan done"
